# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: envio-indexer
field_selection:
  transaction_fields:
    - hash
networks:
  - id: 69
    start_block: 24572720
    rpc_config:
      url: https://minanet-fork-production.up.railway.app
    contracts:
      - name: Launchpad
        address:
          - 0xcEd87d14DE7c73683350e3717069563d3325E786
        handler: src/EventHandlers.ts
        events:
          - event: TokenLaunched(address indexed token, address indexed creator, string name, string symbol)
      - name: Token
        handler: src/EventHandlers.ts
        events:
          - event: Transfer(address indexed from, address indexed to, uint256 value)
unordered_multichain_mode: true
preload_handlers: true
